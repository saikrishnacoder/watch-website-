<!DOCTYPE html>
<html>
  <body>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <form name="appointment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="appointment" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="boutique" />
      <input type="text" name="date" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="register" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="register" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="reference" />
      <input type="text" name="serial" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
