[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Privacy is a standalone document. force=true so it is never the SPA shell.
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200
  force = true

# Maison model: no cart. Kinetic lab is not on the public journey.
[[redirects]]
  from = "/checkout"
  to = "/boutique"
  status = 301

[[redirects]]
  from = "/checkout/"
  to = "/boutique"
  status = 301

[[redirects]]
  from = "/motion"
  to = "/atelier"
  status = 301

[[redirects]]
  from = "/motion/"
  to = "/atelier"
  status = 301

# Existing files win (collection/index.html, maison/index.html, journal notes, signature watches).
# This catch-all is only for client routes that have no stamped HTML (atelier SKUs, craft sheets).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/privacy"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
