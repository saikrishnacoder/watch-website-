[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/collection"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/collection/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/chronograph"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/diver"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/imperial"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/meridian"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/maison"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/privacy"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
