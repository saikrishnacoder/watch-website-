<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070605" />
    <title>HORLOGE — Tempus compositum</title>
    <meta
      name="description"
      content="Independent Geneva watchmaking since 1924. HORLOGE — Tempus compositum. Five lines composed around a gold meridian at 12."
    />
    <style>
      #root > .static-route {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="magnet" />
      <input type="text" name="source" />
      <input name="bot-field" />
    </form>
    <form name="appointment" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="boutique" />
      <input type="text" name="date" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="watch" />
      <input type="text" name="edition" />
      <input name="bot-field" />
    </form>
    <form name="advisor" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="boutique" />
      <textarea name="message"></textarea>
      <input type="text" name="watch" />
      <input name="bot-field" />
    </form>
    <form name="register" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="reference" />
      <input type="text" name="serial" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <noscript>
      <div class="static-route" data-route="/">
        <header>
          <p>HORLOGE</p>
        </header>
        <main>
          <h1>HORLOGE — Tempus compositum</h1>
          <p>
            Every HORLOGE composition begins from a gold line at twelve. Cinematic opening, five collections, craft, and
            a private viewing — not a storefront.
          </p>
          <nav aria-label="HORLOGE — Tempus compositum">
            <a href="/collection">Discover the collection</a>
            <a href="/maison">The Maison</a>
            <a href="/atelier">Craft</a>
            <a href="/journal">Journal</a>
            <a href="/boutique">Private Viewing</a>
          </nav>
        </main>
      </div>
    </noscript>
    <div id="root" data-page="/">
      <div class="static-route" data-route="/">
        <header>
          <p>HORLOGE</p>
        </header>
        <main>
          <h1>HORLOGE — Tempus compositum</h1>
          <p>
            Every HORLOGE composition begins from a gold line at twelve. Cinematic opening, five collections, craft, and
            a private viewing — not a storefront.
          </p>
          <nav aria-label="HORLOGE — Tempus compositum">
            <a href="/collection">Discover the collection</a>
            <a href="/maison">The Maison</a>
            <a href="/atelier">Craft</a>
            <a href="/journal">Journal</a>
            <a href="/boutique">Private Viewing</a>
          </nav>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
